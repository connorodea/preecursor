# Include ONLY inside the existing TLS server block after the backend passes staging.
# No change to the static location / or to the site's HTTP->HTTPS redirect.
location ^~ /acquisition/ {
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_pass http://127.0.0.1:8091/;
    proxy_set_header Host $host;
    # Always overwrite; never trust a client's forwarded address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    # Token URLs and PII must not enter the web access log.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
